[project]
name = "trialscribe-auth"
version = "0.1.0"
description = "TrialScribe authentication service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator==2.3.0",
    "fastapi[standard]>=0.115.14,<0.116",
    "pydantic-settings==2.14.2",
    "PyJWT[crypto]==2.13.0",
    "pwdlib[argon2]==0.3.0",
    "redis==8.0.1",
    "trialscribe-database",
    "trialscribe-observability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialscribe_auth"]

[tool.uv.sources]
trialscribe-observability = { workspace = true }
