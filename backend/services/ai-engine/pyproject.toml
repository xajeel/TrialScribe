[project]
name = "trialscribe-ai"
version = "0.1.0"
description = "TrialScribe AI engine — LangGraph multi-agent pipeline and FastAPI service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.85",
    "chromadb>=1.0.9",
    "faiss-cpu>=1.11.0",
    "fastapi[standard]>=0.115.9",
    "langchain>=0.3.25",
    "langchain-chroma>=0.2.4",
    "langchain-community>=0.3.24",
    "langchain-openai>=0.3.17",
    "langchain-tavily>=0.2.11",
    "langchain-unstructured>=0.1.6",
    "langgraph>=0.4.5",
    "langgraph-supervisor>=0.0.23",
    "openai>=1.79.0",
    "pdfplumber>=0.11.6",
    "pypdf>=5.5.0",
    "pypdf2>=3.0.1",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "tiktoken>=0.9.0",
    "unstructured>=0.17.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trialscribe_ai"]
