name: CI

on:
  pull_request:
    branches:
      - staging

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.10.7"

      - name: Install frozen backend workspace
        working-directory: backend
        run: uv sync --frozen --all-packages

      - name: Test PostgreSQL foundation
        run: ./scripts.sh db test

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Test local infrastructure
        run: ./scripts.sh infra test

  ai-engine:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: dummy
      TAVILY_API_KEY: dummy
      NCBI_API_KEY: dummy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync backend workspace
        working-directory: backend
        run: uv sync --all-packages

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Smoke tests
        working-directory: backend
        run: uv run --package trialscribe-ai pytest services/ai-engine/tests/

  streamlit-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync streamlit-ui (validates the path dependency on ai-engine)
        working-directory: frontend/streamlit-ui
        run: uv sync
