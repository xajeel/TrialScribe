[project]
name = "trialscribe-gateway"
version = "0.1.0"
description = "TrialScribe API gateway service"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.14,<0.116",
    "httpx==0.28.1",
    "pydantic-settings==2.14.2",
    "PyJWT[crypto]==2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialscribe_gateway"]
