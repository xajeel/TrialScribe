[project]
name = "trialscribe-ai"
version = "0.1.0"
description = "TrialScribe AI engine — LangGraph multi-agent pipeline and FastAPI service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "biopython>=1.85,<2",
    "fastapi[standard]>=0.115.9,<0.116",
    "langchain>=0.3.25,<0.4",
    "langchain-community>=0.3.24,<0.4",
    "langchain-openai>=0.3.17,<0.4",
    "langchain-tavily>=0.2.11,<0.3",
    "langchain-unstructured>=0.1.6,<0.2",
    "langgraph>=0.4.5,<0.5",
    "langgraph-supervisor>=0.0.23,<0.1",
    "openai>=1.79.0,<2",
    "pdfplumber>=0.11.6,<0.12",
    "pypdf==6.15.0",
    "pypdf2>=3.0.1,<4",
    "python-dotenv>=1.1.0,<2",
    "requests>=2.32.3,<3",
    "tiktoken>=0.9.0,<0.10",
    "trialscribe-database",
    "trialscribe-events",
    "unstructured>=0.17.2,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialscribe_ai"]
