services:
  ai-engine:
    build:
      context: .
      dockerfile: backend/services/ai-engine/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env

  streamlit-ui:
    build:
      context: .
      dockerfile: frontend/streamlit-ui/Dockerfile
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - ai-engine
