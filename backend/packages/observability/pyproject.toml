[project]
name = "trialscribe-observability"
version = "0.1.0"
description = "Shared Prometheus metrics helpers for TrialScribe backend services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "prometheus-client==0.26.0",
    "starlette==0.46.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialscribe_observability"]
