[project]
name = "trialscribe-worker"
version = "0.1.0"
description = "TrialScribe worker service"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.14,<0.116",
    "pydantic-settings==2.14.2",
    "redis==8.0.1",
    "trialscribe-database",
    "trialscribe-events",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialscribe_worker"]
