[project]
name = "trialscribe-events"
version = "0.1.0"
description = "Shared Kafka event contracts and runtime for TrialScribe backend services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiokafka==0.14.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "trialscribe-database",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialscribe_events"]
